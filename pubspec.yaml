name: sealink_bd
description: Seafood Supply Chain App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  dio: ^5.4.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.2.4
  intl: ^0.19.0
  socket_io_client: ^3.0.0
  youtube_player_flutter: ^10.0.1
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6
  flutter_animate: ^4.5.2
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/models/demand_model.tflite